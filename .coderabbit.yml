# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

tone_instructions: >-
  Prioritize correctness and the CLAUDE.md invariants over style. Checkstyle, PMD, SpotBugs
  and Modernizer already fail the build on style/modernization, so don't re-flag those.
  Non-final classes and "== not !=" with an else are deliberate.

reviews:
  profile: assertive
  request_changes_workflow: false
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main
      - "releases/.*"
  path_filters:
    - "!**/target/**"
    - "!.jackknife/**"
    - "!build-logs/**"
  path_instructions:
    - path: "src/main/java/**"
      instructions: >-
        The published library: treat the public API and Serializable form as compatibility
        contracts and call out breaking changes. Follow CLAUDE.md: "==" not "!=" in an if
        paired with an else; no "final" on value, data, or helper classes; no "utils" or
        "helper" package or class names; favor immutability and constructor injection; the
        Logger field comes first unless @Slf4j. Public classes and methods need
        complete-sentence Javadoc ending with a period, including @param, @return, and
        @throws. IDataSet decorators, DatabaseOperation composites, and the vendor overrides
        under ext/ follow established patterns. Lombok and JSpecify are not dependencies here.
    - path: "src/test/java/**/*IT.java"
      instructions: >-
        Integration tests (Failsafe) run against a real database that DatabaseEnvironment
        bootstraps from the active Maven profile, with user.timezone=Europe/Berlin. Name
        methods test<Method>_<StartingStateConditions>_<AssertedOutcome>. Prefer AssertJ;
        assert a whole expected object rather than field by field; add .as("...") ending with
        a period. A test that would still pass without exercising the behavior under test is a
        bug.
    - path: "src/test/java/**/*Test.java"
      instructions: >-
        Unit tests (Surefire; Mockito and pure logic). Same naming and AssertJ conventions as
        the integration tests.
    - path: "src/site/**/*.adoc"
      instructions: >-
        Rendered by the Maven site through the Doxia Asciidoctor bridge, not asciidoctor
        directly. Do not raise these known bridge limits as bugs: "a|" AsciiDoc table cells
        are never processed (plain "|" is used deliberately); admonition and open blocks
        always render as "Fallback behaviour"; body "link:" macros need repository-relative
        paths and never a leading slash. Never propose deleting src/site/asciidoc/README.adoc.
    - path: "src/changes/changes.xml"
      instructions: >-
        The Maven Changes changelog for the library. New <action> entries go at the bottom of
        the current release as one plain-text line each - escapeText is on and a multi-line
        body breaks the announcement script, so split a list into multiple <action>s sharing
        the issue. Each entry needs dev, type (one of add, fix, update, remove), issue,
        system="github", and due-to. The release description stays a one or two sentence theme
        summary, not a per-entry concatenation.
    - path: ".github/**"
      instructions: >-
        actionlint and zizmor (workflow security) run here as a blocking "Lint workflows" CI
        job and on a weekly schedule; zizmor's policy lives in .github/zizmor.yml. Ruff lints
        the Python scripts under .github/scripts, each of which has its own pytest suite. Flag
        a script change that arrives without a matching test update. The `# zizmor: ignore[...]`
        suppressions, the tag-pinned first-party `actions/*` refs, and the workspace-relative
        `./.github/actions/...` action syntax are deliberate policy — do not re-raise them in
        prose review.
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
  learnings:
    scope: auto
