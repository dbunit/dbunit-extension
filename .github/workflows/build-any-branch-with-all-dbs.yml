name: Build any branch with all databases

on:
  # Adds the manual "Run workflow" button
  workflow_dispatch:
  push:
    paths-ignore:
      - 'src/site/**'
      - '**/*.adoc'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'src/site/**'
      - '**/*.adoc'
      - '**/*.md'

permissions: {}

env:
  MAVEN_COMMAND: ./mvnw
  MAVEN_CLI_COMMON: "-e -B"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/jdk-setup
    - name: Compile and run unit tests
      run: ${{ env.MAVEN_COMMAND }} ${{ env.MAVEN_CLI_COMMON }} clean test
    - name: Upload target directory for reuse
      uses: actions/upload-artifact@v7
      with:
        name: target-directory
        path: target/
        retention-days: 11

  ITs:
    needs: [compile-and-unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        database: [
          {name: 'DB2', profile: 'db2-11-5', url: ''},
          {name: 'Derby', profile: 'derby-10-14', url: ''},
          {name: 'H2', profile: 'h2-1-4', url: ''},
          {name: 'HSQLDB', profile: 'hsqldb-2-7', url: ''},
          # nullCatalogMeansCurrent=true must also stay on mariadb-dbunit.properties'
          # dbunit.profile.url - see mariadb.adoc's IMetadataHandler section for why.
          {name: 'MariaDB', profile: 'mariadb-11-4', url: 'jdbc:mariadb://localhost:3306/dbunit?nullCatalogMeansCurrent=true'},
          {name: 'MSSQL', profile: 'mssql-2022', url: 'jdbc:sqlserver://localhost:1433;DatabaseName=dbunit;user=sa;password=theSaPassword1234;Trusted_Connection=True;SelectMethod=cursor'},
          {name: 'MySQL', profile: 'mysql-9-20', url: 'jdbc:mysql://localhost:3306/dbunit'},
          {name: 'Oracle 18', profile: 'oracle-18', url: ''},
          {name: 'Oracle 23', profile: 'oracle-23', url: ''},
          {name: 'PostgreSQL', profile: 'postgresql-16', url: 'jdbc:postgresql://localhost:5432/dbunit'}
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/jdk-setup
      - name: Download target directory
        uses: actions/download-artifact@v8
        with:
          name: target-directory
          path: target/
      # icr.io, the registry of the DB2 image, regularly times out, and the docker-maven-plugin
      # does not retry a pull. The plugin then finds the image already pulled and skips its pull.
      # Four attempts of at most 5 minutes each, with their pauses, end inside the job's timeout.
      - name: Pull the DB2 image, retrying when the registry times out
        if: matrix.database.profile == 'db2-11-5'
        run: |
          image=$(sed -n 's|.*<docker.image.name.db2-11>\(.*\)</docker.image.name.db2-11>.*|\1|p' pom.xml)
          test -n "$image" || { echo "docker.image.name.db2-11 is not set in pom.xml."; exit 1; }
          for attempt in 1 2 3 4; do
            if timeout 5m docker pull "$image"; then
              exit 0
            fi
            echo "Pulling $image failed on attempt $attempt."
            test "$attempt" -eq 4 || sleep $((attempt * 20))
          done
          exit 1
      - name: Run ${{ matrix.database.name }} integration tests
        run: ${{ env.MAVEN_COMMAND }} ${{ env.MAVEN_CLI_COMMON }} -P${{ matrix.database.profile }} verify ${{ matrix.database.url != '' && format('-Ddbunit.profile.url={0}', matrix.database.url) || '' }}
